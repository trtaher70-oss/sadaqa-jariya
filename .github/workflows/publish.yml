name: publish
# Every hour: publish any slot whose time has come (Turkey time) and is not done yet. State is committed back,
# which also keeps the scheduled workflow alive.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "force a slot now (morning / afternoon / evening) — empty = normal run"
        required: false
      preview:
        description: "only prepare the next posts for the dashboard (no publishing)"
        type: boolean
        default: false
      dry:
        description: "test only: render, do not publish (the video is attached to the run)"
        type: boolean
        default: false
concurrency:
  group: publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - name: what is due
        id: due
        run: python3 engine/due.py >> "$GITHUB_OUTPUT"
        env:
          FORCE: ${{ github.event.inputs.slot }}
          PREV: ${{ github.event.inputs.preview }}
      - uses: actions/setup-python@v5
        if: steps.due.outputs.due == 'yes'
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        if: steps.due.outputs.due == 'yes'
        with: {node-version: "22"}
      - name: cache video tools
        if: steps.due.outputs.due == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            video/node_modules
            ~/.cache/remotion
          key: video-${{ hashFiles('video/package.json') }}
      - name: install
        if: steps.due.outputs.due == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q -r requirements.txt
          cd video && npm install --no-audit --no-fund --loglevel=error && npx remotion browser ensure
      - name: publish
        if: steps.due.outputs.due == 'yes'
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event.inputs.preview }}" = "true" ]; then python engine/run.py --preview; exit 0; fi
          if [ "${{ github.event.inputs.dry }}" = "true" ]; then python engine/run.py --slot "${{ github.event.inputs.slot }}" --dry
          elif [ -n "${{ github.event.inputs.slot }}" ]; then python engine/run.py --slot "${{ github.event.inputs.slot }}"
          else python engine/run.py; fi
      - name: attach test video
        if: github.event.inputs.dry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reel
          path: |
            work/**/video.mp4
            work/**/cover.jpg
            work/**/props.json
      - name: save state
        if: always() && steps.due.outputs.due == 'yes' && github.event.inputs.dry != 'true'
        run: |
          git config user.name "sadaqa-bot"
          git config user.email "sadaqa-bot@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -q -m "state: $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
  site:
    # the dashboard (docs/) + phone-friendly copies of the next reels, published to GitHub Pages
    needs: run
    if: always() && needs.run.outputs.due == 'yes'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git pull -q origin main || true
          mkdir -p _site/preview && cp -r docs/. _site/
          gh release download preview -p 'light-*' -D _light --clobber -R "$GITHUB_REPOSITORY" || true
          for f in _light/light-*; do [ -f "$f" ] && cp "$f" "_site/preview/$(basename "$f" | sed 's/^light-//')"; done
          ls -la _site/preview || true
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
  keepalive:
    # GitHub pauses scheduled workflows in repos with no commits for 60 days; touch a file monthly.
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "$(date -u +%d%H)" = "0103" ]; then
            date -u +%F > state/alive.txt
            git config user.name "sadaqa-bot"; git config user.email "sadaqa-bot@users.noreply.github.com"
            git add state/alive.txt && git commit -q -m "keepalive" && git pull -q --rebase origin main && git push -q
          fi
