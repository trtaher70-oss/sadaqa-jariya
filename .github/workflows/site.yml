name: site
# Re-publish the dashboard right away when it changes (the hourly job also re-publishes after each post).
on:
  push:
    branches: [main]
    paths: ["docs/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: check dashboard code (a broken page is never published)
        run: |
          python3 -c "import re; t=open('docs/index.html',encoding='utf-8').read(); open('/tmp/d.mjs','w',encoding='utf-8').write(re.findall(r'<script>(.*?)</script>', t, re.S)[-1])"
          node --check /tmp/d.mjs
      - name: assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/preview && cp -r docs/. _site/
          gh release download preview -p 'light-*' -D _light --clobber -R "$GITHUB_REPOSITORY" || true
          for f in _light/light-*; do [ -f "$f" ] && cp "$f" "_site/preview/$(basename "$f" | sed 's/^light-//')"; done
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: wait before retrying the deployment (GitHub sometimes can't find the artifact right away)
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
